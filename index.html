<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 ZaDooMoff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        canvas#particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 92%;
            padding: 40px 30px;
            text-align: center;
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.15);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.05), 0 0 80px rgba(138, 43, 226, 0.05);
            animation: cardAppear 1.5s ease-out;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 4vw, 22px);
            color: #00ffff;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ffff, 0 0 30px rgba(0, 255, 255, 0.4), 0 0 60px rgba(0, 255, 255, 0.2);
            animation: glowPulse 2s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes glowPulse {
            from { text-shadow: 0 0 10px #00ffff, 0 0 30px rgba(0, 255, 255, 0.4); }
            to { text-shadow: 0 0 15px #00ffff, 0 0 40px rgba(0, 255, 255, 0.6), 0 0 80px rgba(0, 255, 255, 0.3); }
        }

        .typewriter {            
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(13px, 3vw, 17px);
            line-height: 1.8;
            color: #c8c8d4;
            min-height: 100px;
            text-align: left;
            padding: 0 5px;
        }

        .typewriter .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #00ffff;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .image-container {
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .image-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .image-container img {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15), 0 0 60px rgba(138, 43, 226, 0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .image-container img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.25), 0 0 80px rgba(138, 43, 226, 0.2);
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }

        .corner { position: absolute; width: 20px; height: 20px; }
        .corner::before, .corner::after { content: ''; position: absolute; background: #00ffff; }
        .corner-tl { top: -1px; left: -1px; }
        .corner-tl::before { top: 0; left: 0; width: 20px; height: 2px; }
        .corner-tl::after { top: 0; left: 0; width: 2px; height: 20px; }
        .corner-tr { top: -1px; right: -1px; }
        .corner-tr::before { top: 0; right: 0; width: 20px; height: 2px; }
        .corner-tr::after { top: 0; right: 0; width: 2px; height: 20px; }
        .corner-bl { bottom: -1px; left: -1px; }
        .corner-bl::before { bottom: 0; left: 0; width: 20px; height: 2px; }
        .corner-bl::after { bottom: 0; left: 0; width: 2px; height: 20px; }
        .corner-br { bottom: -1px; right: -1px; }
        .corner-br::before { bottom: 0; right: 0; width: 20px; height: 2px; }
        .corner-br::after { bottom: 0; right: 0; width: 2px; height: 20px; }

        .sound-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(20, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            transition: all 0.3s;
        }
        .sound-btn:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            .card { padding: 30px 20px; width: 95%; }
        }
    </style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="scanlines"></div>

<div class="card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <h1 class="title">🎮 LEVEL 36</h1>

    <div class="typewriter" id="typewriter"></div>

    <div class="image-container" id="imageContainer">
        <!--
            =============================================
            Вставь сюда свою картинку:
            Замени src на путь к своему файлу, например:
            src="photo.jpg" или src="./img/photo.png"
            Или используй прямую ссылку на изображение.
            =============================================
        -->
        <img src="doom.jpg" alt="Для тебя!">
    </div>
</div>

<!-- ... твой код с .card ... -->
</div>

<!-- ============================================= -->
<!-- ЭЛЕМЕНТЫ ДЛЯ МУЗЫКИ -->
<!-- ============================================= -->
<audio id="backgroundMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Твой браузер не поддерживает аудио.
</audio>

<button id="soundButton" class="sound-btn">ЗВУК ВКЛ</button>
<!-- ============================================= -->

<script>
// ========== PARTICLES ==========
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
const PARTICLE_COUNT = 80;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.5 + 0.1;
        this.color = Math.random() > 0.5 ? '0, 255, 255' : '138, 43, 226';
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
        ctx.fill();
    }
}

for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

function connectParticles() {
    for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(0, 255, 255, ${0.08 * (1 - dist / 120)})`;
                ctx.lineWidth = 0.5;
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }
        }
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    connectParticles();
    requestAnimationFrame(animateParticles);
}
animateParticles();

// ========== TYPEWRITER ==========
const typewriterEl = document.getElementById('typewriter');

// ============================================================
// ИЗМЕНИ ТЕКСТ ЗДЕСЬ! Каждый элемент массива — одна строка.
// Можешь добавлять, удалять, менять текст.
// \n — перенос строки внутри одного элемента.
// ============================================================
const textLines = [
    "Здарова, зае..",
    "замечательный человек!",
    "С Днем Рождения!!!",
    "Ты из тех, с кем можно и в рейд, и по жизни!",
    "С кем можно разделить дым, спирт, порох и..",
    "...... ...",
    "😊",
    "Спасибо тебе за помощь!",
    "Будь счастлив!",
    "Не кашляй и не чихай!",
    "...",
    "...",
    "... хотел подарить тебе игрушку,",
    "но я хз какую)",
    "так что..",
    "назови жене пропущенную фразу",
    "и купи себе что-нибудь 😉",
    "",
    "Джамшут!!!",
    "Френдли!!!"
];

const TYPING_SPEED = 60;       // мс между буквами
const LINE_PAUSE = 700;        // пауза после строки
const FINAL_PAUSE = 800;       // пауза перед показом картинки

let lineIndex = 0;
let charIndex = 0;
let currentText = '';

function typeNextChar() {
    if (lineIndex >= textLines.length) {
        // Typing complete — show image
        setTimeout(() => {
            document.getElementById('imageContainer').classList.add('visible');
        }, FINAL_PAUSE);
        return;
    }

    const line = textLines[lineIndex];

    if (charIndex < line.length) {
        currentText += line[charIndex];
        charIndex++;
        // Render all typed text so far
        let html = '';
        for (let i = 0; i <= lineIndex; i++) {
            if (i < lineIndex) {
                html += textLines[i] + '<br>';
            } else {
                html += currentText + '<span class="cursor"></span>';
            }
        }
        typewriterEl.innerHTML = html;
        setTimeout(typeNextChar, TYPING_SPEED);
    } else {
        // Line done
        lineIndex++;
        charIndex = 0;
        currentText = '';
        setTimeout(typeNextChar, LINE_PAUSE);
    }
}

// Start typewriter after a short delay
setTimeout(typeNextChar, 1200);

// ========== MUSIC PLAYER ==========
const music = document.getElementById('backgroundMusic');
const soundButton = document.getElementById('soundButton');
let isPlaying = false;

// Устанавливаем громкость (от 0 до 1)
music.volume = 0.4; // Можешь сделать потише или погромче

soundButton.addEventListener('click', () => {
    if (isPlaying) {
        music.pause();
        soundButton.textContent = 'ЗВУК ВКЛ';
    } else {
        music.play();
        soundButton.textContent = 'ЗВУК ВЫКЛ';
    }
    isPlaying = !isPlaying;
});
</script>
</body>
</html>
